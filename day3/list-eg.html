<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tyes</title>
</head>
<body>
    <h1>LIST TYPES EXAMPLES</h1>
    <!-- Ordered list -->
     <h4>Orderes list</h4>
     <ol type="A" start="5">
         <li>Apple</li>
         <li>Banana</li>
         <li>Mango</li>
         <li>Grapes</li>
        </ol>
        
  <h4>Unordered list</h4>
  <!-- Unoreders list -->
   <ul type="square">
    <li>Apple</li>
         <li>Banana</li>
         <li>Mango</li>
         <li>Grapes</li>
   </ul>

   <h4>Definition list</h4>
  <!-- Definition list -->
   <dt>Definition</dt>
   <dd>HTML</dd>
   <dd>CSS  </dd>
</body>
</html>
