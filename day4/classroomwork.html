<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table </title>
</head>
<body>
    <h1>HTML TABLES</h1>
    <table border="1" style="border-collapse: collapse;">
        <colgroup>
            <col style="background-color: aquamarine;">
            <col span="2"style="background-color: yellow;">
            <col style="background-color: blue;">
        </colgroup>
        <thead>
            <tr>
                <th>SN</th>
                <th colspan="2">Full Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
            <td>1</td>
            <td>Ram</td>
            <td>Bhandari</td>
            <td>80.45</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Sita</td>
            <td>Bhandari</td>
            <td>70.45</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Hari</td>
            <td>Bhandari</td>
            <td>80.45</td>
        </tr>
    </table>
    <H1>SECOND TABLE</H1>
    <table border="1" style="border-collapse: collapse   ;">
        <tr>
            <th colspan="3">STUDENT RECORD</th>
        </tr>
        <tr>
            <th rowspan="2">FULL NAME</th>
            <td>Ram</td>
            <td>Pradip</td>
        </tr>   
        <tr>
            <td>Bhandari</td>
            <td>Karki</td>
        </tr>
        <tr>
            <th>ROLL</th>
            <td>20</td>
            <td>22</td>
        </tr>   
        <tr>
            <th>MARKS</th>
            <td>80</td>
            <td>90</td>
        </tr>   
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Note:THIS IS THE TABLE EXAMPLE</th  >
            </tr>
        </tfoot>
    </table>
</body>
</html>
