<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Worksheet</title>
    <style>
        th ,td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table border="1" style="border-collapse:collapse;">
        <caption><h2>STUDENT MARKSHEET</h2></caption>
        <colgroup>
            <col span="2" style="background-color: rgb(182, 182, 182);">
            <col span="3" style="background-color: rgb(127, 201, 230);">
            <col style="background-color:rgb(127, 221, 182);">
        </colgroup>
        <thead>
            <tr>
                <th colspan="2">Student Details</th>
                <th colspan="3">Subjects marks (Out of 100)</th>
                <th rowspan="2">Total <br><small>out of 300</small></th>
            </tr>
            <tr>
                <th>Roll no.</th>
                <th>Name</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>Javascript</th>
            </tr>
        </thead>
        <tbody>
           <tr>
                <td>1</td>
                <td>Asha</td>
                <td>88</td>
                <td>84</td>
                <td>90</td>
                <td>262</td>
           </tr> 
            <tr>
                <td>2</td>
                <td>Bikash</td>
                <td>75</td>
                <td>80</td>
                <td>78</td>
                <td>233</td>
           </tr> 
            <tr>
                <td>3</td>
                <td>Nisha</td>
                <td>92</td>
                <td>89</td>
                <td>94</td>
                <td>275</td>
           </tr> 
            <tr>
                <td>4</td>
                <td>Suman</td>
                <td>68</td>
                <td>72</td>
                <td>70</td>
                <td>210</td>
           </tr> 
        </tbody>
        
        <tfoot>
           <tr>
             <td colspan="5" style="text-align: left;">Class average (out of 300)</td>
            <td>245</td>
           </tr>
        </tfoot>
    </table>
</body>
</html>
